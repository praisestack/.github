<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Layer Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.30" />
    </filter>
    <!-- Radiant Amber Aura (PraiseStack Org Pinnacle) -->
    <filter id="amberAura" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
    <!-- Radiant Broadcast Scarlet Aura (Praise Live Monolithic Column) -->
    <filter id="liveRedAura" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#DC2626" flood-opacity="0.35" />
    </filter>

    <!-- Layer 3 (Royal Blue Foundation) -->
    <linearGradient id="blueTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="blueLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="blueRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="blueInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="blueRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.75" />
    </linearGradient>

    <!-- Layer 2 (Electric Cyan Presentation Platform) -->
    <linearGradient id="cyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyanLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="cyanRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="cyanInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Layer 1 (Amber / Gold Pinnacle: Worship & Reverence) -->
    <linearGradient id="amberTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="amberLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="amberRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="amberInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="amberRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FEF3C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Praise Live: Monolithic Live Production Column Gradients (Complementary Crimson/Coral) -->
    <linearGradient id="queueTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECACA" />
      <stop offset="20%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="queueLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="queueRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="queueRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FEE2E2" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FECACA" stop-opacity="0.90" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/>
    <!-- LAYER 3: BLUE FOUNDATION CHEVRON -->
    <g filter="url(#softShadow)" stroke-linejoin="round">
      <path d="M 769.64 699.85 L 512.0 551.1 L 512.0 642.9 L 769.64 791.65 Z" fill="url(#blueLeft)" />
      <path d="M 512.0 551.1 L 254.36 699.85 L 254.36 791.65 L 512.0 642.9 Z" fill="url(#blueInner)" />
      <path d="M 85.05 602.1 L 254.36 699.85 L 254.36 791.65 L 85.05 693.9 Z" fill="url(#blueLeft)" />
      <path d="M 938.95 602.1 L 769.64 699.85 L 769.64 791.65 L 938.95 693.9 Z" fill="url(#blueRight)" />
      <line x1="254.36" y1="699.85" x2="254.36" y2="791.65"
            stroke="#93C5FD" stroke-width="3.74" stroke-linecap="round" opacity="0.90" />
      <line x1="769.64" y1="699.85" x2="769.64" y2="791.65"
            stroke="#93C5FD" stroke-width="3.74" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="551.1" x2="512.0" y2="642.9"
            stroke="#93C5FD" stroke-width="3.06" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 355.6 L 938.95 602.1 L 769.64 699.85 L 512.0 551.1 L 254.36 699.85 L 85.05 602.1 Z" fill="url(#blueTop)" stroke="url(#blueRim)" stroke-width="3.4" />
      <path d="M 512.0 355.6 L 938.95 602.1 L 769.64 699.85 L 512.0 551.1 L 254.36 699.85 L 85.05 602.1 Z" fill="none" stroke="#FFFFFF" stroke-width="2.04" opacity="0.3" />
    </g>

    <!-- LAYER 2: CYAN PLATFORM CHEVRON -->
    <g filter="url(#softShadow)" stroke-linejoin="round">
      <path d="M 769.64 563.85 L 512.0 415.1 L 512.0 506.9 L 769.64 655.65 Z" fill="url(#cyanLeft)" />
      <path d="M 512.0 415.1 L 254.36 563.85 L 254.36 655.65 L 512.0 506.9 Z" fill="url(#cyanInner)" />
      <path d="M 85.05 466.1 L 254.36 563.85 L 254.36 655.65 L 85.05 557.9 Z" fill="url(#cyanLeft)" />
      <path d="M 938.95 466.1 L 769.64 563.85 L 769.64 655.65 L 938.95 557.9 Z" fill="url(#cyanRight)" />
      <line x1="254.36" y1="563.85" x2="254.36" y2="655.65"
            stroke="#E0F2FE" stroke-width="3.74" stroke-linecap="round" opacity="0.90" />
      <line x1="769.64" y1="563.85" x2="769.64" y2="655.65"
            stroke="#E0F2FE" stroke-width="3.74" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="415.1" x2="512.0" y2="506.9"
            stroke="#E0F2FE" stroke-width="3.06" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 219.6 L 938.95 466.1 L 769.64 563.85 L 512.0 415.1 L 254.36 563.85 L 85.05 466.1 Z" fill="url(#cyanTop)" stroke="url(#cyanRim)" stroke-width="3.4" />
      <path d="M 512.0 219.6 L 938.95 466.1 L 769.64 563.85 L 512.0 415.1 L 254.36 563.85 L 85.05 466.1 Z" fill="none" stroke="#FFFFFF" stroke-width="2.04" opacity="0.38" />
    </g>

    <!-- LAYER 1: AMBER PINNACLE CHEVRON -->
    <g filter="url(#amberAura)" stroke-linejoin="round">
      <path d="M 769.64 427.85 L 512.0 279.1 L 512.0 370.9 L 769.64 519.65 Z" fill="url(#amberLeft)" />
      <path d="M 512.0 279.1 L 254.36 427.85 L 254.36 519.65 L 512.0 370.9 Z" fill="url(#amberInner)" />
      <path d="M 85.05 330.1 L 254.36 427.85 L 254.36 519.65 L 85.05 421.9 Z" fill="url(#amberLeft)" />
      <path d="M 938.95 330.1 L 769.64 427.85 L 769.64 519.65 L 938.95 421.9 Z" fill="url(#amberRight)" />
      <line x1="254.36" y1="427.85" x2="254.36" y2="519.65"
            stroke="#FEF3C7" stroke-width="3.74" stroke-linecap="round" opacity="0.90" />
      <line x1="769.64" y1="427.85" x2="769.64" y2="519.65"
            stroke="#FEF3C7" stroke-width="3.74" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="279.1" x2="512.0" y2="370.9"
            stroke="#FEF3C7" stroke-width="3.06" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 83.6 L 938.95 330.1 L 769.64 427.85 L 512.0 279.1 L 254.36 427.85 L 85.05 330.1 Z" fill="url(#amberTop)" stroke="url(#amberRim)" stroke-width="3.4" />
      <path d="M 512.0 83.6 L 938.95 330.1 L 769.64 427.85 L 512.0 279.1 L 254.36 427.85 L 85.05 330.1 Z" fill="none" stroke="#FFFFFF" stroke-width="2.04" opacity="0.5" />
    </g>
    <!-- LIVE PRODUCTION MONOLITHIC COLUMN (ALIGNED TO 3D BOUNDING CUBE CORNER) -->
    <g filter="url(#liveRedAura)" stroke-linejoin="round">
      <path d="M 330.91 472.05 L 512.0 576.6 L 512.0 940.4 L 330.91 835.85 Z" fill="url(#queueLeft)" />
      <path d="M 693.09 472.05 L 512.0 576.6 L 512.0 940.4 L 693.09 835.85 Z" fill="url(#queueRight)" />
      <!-- Vertical Corner Seam -->
      <line x1="512.0" y1="576.6" x2="512.0" y2="940.4"
            stroke="#FECACA" stroke-width="4.08" stroke-linecap="round" opacity="0.95" />
      <!-- Outer Vertical Edges -->
      <line x1="330.91" y1="472.05" x2="330.91" y2="835.85"
            stroke="#FECACA" stroke-width="2.72" stroke-linecap="round" opacity="0.65" />
      <line x1="693.09" y1="472.05" x2="693.09" y2="835.85"
            stroke="#FECACA" stroke-width="2.72" stroke-linecap="round" opacity="0.65" />
      <!-- Top Face -->
      <path d="M 512.0 367.5 L 693.09 472.05 L 512.0 576.6 L 330.91 472.05 Z" fill="url(#queueTop)" stroke="url(#queueRim)" stroke-width="3.4" />
      <path d="M 512.0 367.5 L 693.09 472.05 L 512.0 576.6 L 330.91 472.05 Z" fill="none" stroke="#FFFFFF" stroke-width="2.04" opacity="0.60" />
    </g>
</svg>

      <line x1="599.9" y1="411.05" x2="599.9" y2="442.37"
            stroke="#E0F2FE" stroke-width="1.276" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="360.3" x2="512.0" y2="391.62"
            stroke="#E0F2FE" stroke-width="1.044" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 293.6 L 657.67 377.7 L 599.9 411.05 L 512.0 360.3 L 424.1 411.05 L 366.33 377.7 Z" fill="url(#cyanTop)" stroke="url(#cyanRim)" stroke-width="1.16" />
      <path d="M 512.0 293.6 L 657.67 377.7 L 599.9 411.05 L 512.0 360.3 L 424.1 411.05 L 366.33 377.7 Z" fill="none" stroke="#FFFFFF" stroke-width="0.696" opacity="0.38" />
    </g>


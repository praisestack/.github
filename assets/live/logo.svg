    </g>
    <!-- LIVE PRODUCTION MONOLITHIC COLUMN (ALIGNED TO 3D BOUNDING CUBE CORNER) -->
    <g filter="url(#liveRedAura)" stroke-linejoin="round">
      <path d="M 450.22 379.73 L 512.0 415.4 L 512.0 539.52 L 450.22 503.85 Z" fill="url(#queueLeft)" />
      <path d="M 573.78 379.73 L 512.0 415.4 L 512.0 539.52 L 573.78 503.85 Z" fill="url(#queueRight)" />

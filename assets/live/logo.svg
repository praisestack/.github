            stroke="#93C5FD" stroke-width="1.044" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 340.0 L 657.67 424.1 L 599.9 457.45 L 512.0 406.7 L 424.1 457.45 L 366.33 424.1 Z" fill="url(#blueTop)" stroke="url(#blueRim)" stroke-width="1.16" />
      <path d="M 512.0 340.0 L 657.67 424.1 L 599.9 457.45 L 512.0 406.7 L 424.1 457.45 L 366.33 424.1 Z" fill="none" stroke="#FFFFFF" stroke-width="0.696" opacity="0.3" />
    </g>

    <!-- LAYER 2: CYAN PLATFORM CHEVRON -->
    <g filter="url(#softShadow)" stroke-linejoin="round">
      <path d="M 599.9 411.05 L 512.0 360.3 L 512.0 391.62 L 599.9 442.37 Z" fill="url(#cyanLeft)" />
      <path d="M 512.0 360.3 L 424.1 411.05 L 424.1 442.37 L 512.0 391.62 Z" fill="url(#cyanInner)" />
      <path d="M 366.33 377.7 L 424.1 411.05 L 424.1 442.37 L 366.33 409.02 Z" fill="url(#cyanLeft)" />
      <path d="M 657.67 377.7 L 599.9 411.05 L 599.9 442.37 L 657.67 409.02 Z" fill="url(#cyanRight)" />
      <line x1="424.1" y1="411.05" x2="424.1" y2="442.37"

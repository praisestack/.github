      <line x1="450.22" y1="379.73" x2="450.22" y2="503.85"
            stroke="#FECACA" stroke-width="0.9279999999999999" stroke-linecap="round" opacity="0.65" />
      <line x1="573.78" y1="379.73" x2="573.78" y2="503.85"
            stroke="#FECACA" stroke-width="0.9279999999999999" stroke-linecap="round" opacity="0.65" />
      <!-- Top Face -->
      <path d="M 512.0 344.06 L 573.78 379.73 L 512.0 415.4 L 450.22 379.73 Z" fill="url(#queueTop)" stroke="url(#queueRim)" stroke-width="1.16" />
      <path d="M 512.0 344.06 L 573.78 379.73 L 512.0 415.4 L 450.22 379.73 Z" fill="none" stroke="#FFFFFF" stroke-width="0.696" opacity="0.60" />
    </g>

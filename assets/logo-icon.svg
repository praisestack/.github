<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Layer Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.30" />
    </filter>
    <!-- Radiant Amber Aura -->
    <filter id="amberAura" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>

    <!-- Layer 3 (Royal Blue Foundation) -->
    <linearGradient id="blueTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="blueLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="blueRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="blueInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="blueRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.75" />
    </linearGradient>

    <!-- Layer 2 (Electric Cyan Presentation Platform) -->
    <linearGradient id="cyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyanLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="cyanRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="cyanInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Layer 1 (Amber / Gold Chevron: Praise Pinnacle) -->
    <linearGradient id="amberTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="amberLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="amberRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="amberInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="amberRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FEF3C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.85" />
    </linearGradient>
  </defs>
    <!-- LAYER 3: BLUE FOUNDATION CHEVRON -->
    <g filter="url(#softShadow)" stroke-linejoin="round">
      <path d="M 663.55 666.5 L 512.0 579.0 L 512.0 633.0 L 663.55 720.5 Z" fill="url(#blueLeft)" />
      <path d="M 512.0 579.0 L 360.45 666.5 L 360.45 720.5 L 512.0 633.0 Z" fill="url(#blueInner)" />
      <path d="M 260.85 609.0 L 360.45 666.5 L 360.45 720.5 L 260.85 663.0 Z" fill="url(#blueLeft)" />
      <path d="M 763.15 609.0 L 663.55 666.5 L 663.55 720.5 L 763.15 663.0 Z" fill="url(#blueRight)" />
      <line x1="360.45" y1="666.5" x2="360.45" y2="720.5"
            stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" opacity="0.90" />
      <line x1="663.55" y1="666.5" x2="663.55" y2="720.5"
            stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="579.0" x2="512.0" y2="633.0"
            stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 464.0 L 763.15 609.0 L 663.55 666.5 L 512.0 579.0 L 360.45 666.5 L 260.85 609.0 Z" fill="url(#blueTop)" stroke="url(#blueRim)" stroke-width="2.0" />
      <path d="M 512.0 464.0 L 763.15 609.0 L 663.55 666.5 L 512.0 579.0 L 360.45 666.5 L 260.85 609.0 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3" />
    </g>

    <!-- LAYER 2: CYAN PLATFORM CHEVRON -->
    <g filter="url(#softShadow)" stroke-linejoin="round">
      <path d="M 663.55 586.5 L 512.0 499.0 L 512.0 553.0 L 663.55 640.5 Z" fill="url(#cyanLeft)" />
      <path d="M 512.0 499.0 L 360.45 586.5 L 360.45 640.5 L 512.0 553.0 Z" fill="url(#cyanInner)" />
      <path d="M 260.85 529.0 L 360.45 586.5 L 360.45 640.5 L 260.85 583.0 Z" fill="url(#cyanLeft)" />
      <path d="M 763.15 529.0 L 663.55 586.5 L 663.55 640.5 L 763.15 583.0 Z" fill="url(#cyanRight)" />
      <line x1="360.45" y1="586.5" x2="360.45" y2="640.5"
            stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.90" />
      <line x1="663.55" y1="586.5" x2="663.55" y2="640.5"
            stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="499.0" x2="512.0" y2="553.0"
            stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 384.0 L 763.15 529.0 L 663.55 586.5 L 512.0 499.0 L 360.45 586.5 L 260.85 529.0 Z" fill="url(#cyanTop)" stroke="url(#cyanRim)" stroke-width="2.0" />
      <path d="M 512.0 384.0 L 763.15 529.0 L 663.55 586.5 L 512.0 499.0 L 360.45 586.5 L 260.85 529.0 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.38" />
    </g>

    <!-- LAYER 1: AMBER PINNACLE CHEVRON -->
    <g filter="url(#amberAura)" stroke-linejoin="round">
      <path d="M 663.55 506.5 L 512.0 419.0 L 512.0 473.0 L 663.55 560.5 Z" fill="url(#amberLeft)" />
      <path d="M 512.0 419.0 L 360.45 506.5 L 360.45 560.5 L 512.0 473.0 Z" fill="url(#amberInner)" />
      <path d="M 260.85 449.0 L 360.45 506.5 L 360.45 560.5 L 260.85 503.0 Z" fill="url(#amberLeft)" />
      <path d="M 763.15 449.0 L 663.55 506.5 L 663.55 560.5 L 763.15 503.0 Z" fill="url(#amberRight)" />
      <line x1="360.45" y1="506.5" x2="360.45" y2="560.5"
            stroke="#FEF3C7" stroke-width="2.2" stroke-linecap="round" opacity="0.90" />
      <line x1="663.55" y1="506.5" x2="663.55" y2="560.5"
            stroke="#FEF3C7" stroke-width="2.2" stroke-linecap="round" opacity="0.90" />
      <line x1="512.0" y1="419.0" x2="512.0" y2="473.0"
            stroke="#FEF3C7" stroke-width="1.8" stroke-linecap="round" opacity="0.80" />
      <path d="M 512.0 304.0 L 763.15 449.0 L 663.55 506.5 L 512.0 419.0 L 360.45 506.5 L 260.85 449.0 Z" fill="url(#amberTop)" stroke="url(#amberRim)" stroke-width="2.0" />
      <path d="M 512.0 304.0 L 763.15 449.0 L 663.55 506.5 L 512.0 419.0 L 360.45 506.5 L 260.85 449.0 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5" />
    </g>
</svg>
